<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thermal Printer Emulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #status-bar {
      background: #16213e;
      color: #e0e0e0;
      padding: 8px 12px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
    }

    #status-bar .status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      flex-shrink: 0;
    }

    #status-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dot-green { background: #4caf50; }
    .dot-red { background: #f44336; }
    .dot-yellow { background: #ff9800; }

    #status-bar .port-info {
      color: #8899aa;
      font-size: 11px;
      flex-shrink: 0;
      margin-left: 8px;
    }

    #status-bar .btn-gear {
      background: none;
      border: none;
      color: #8899aa;
      cursor: pointer;
      font-size: 16px;
      padding: 2px 4px;
      margin-left: 6px;
      flex-shrink: 0;
      line-height: 1;
    }

    #status-bar .btn-gear:hover {
      color: #e0e0e0;
    }

    #paper-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      background: #e8e0d4;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #paper {
      width: 384px;
      flex: 1 0 auto;
      background: #faf8f5;
      padding: 12px 16px;
      box-shadow: 0 0 12px rgba(0,0,0,0.3), inset 0 0 30px rgba(0,0,0,0.05);
      border-radius: 2px;
      font-family: 'Courier New', 'Lucida Console', monospace;
      font-size: 12px;
      line-height: 1.4;
      color: #1a1a1a;
      word-wrap: break-word;
      position: relative;
    }

    #paper .cut-line {
      border-top: 2px dashed #e74c3c;
      margin: 8px 0;
      text-align: center;
      font-size: 10px;
      color: #e74c3c;
      position: relative;
      padding-top: 2px;
    }

    #paper .barcode {
      text-align: center;
      margin: 6px 0;
      padding: 4px 0;
    }

    #paper .barcode svg {
      max-width: 100%;
    }

    #paper .barcode-label {
      text-align: center;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      margin-top: 2px;
    }

    #paper .qrcode {
      text-align: center;
      margin: 6px 0;
    }

    #paper .line-text {
      white-space: pre-wrap;
    }

    .bold { font-weight: bold; }
    .double-h { font-size: 24px; line-height: 1.3; }
    .double-w { letter-spacing: 2px; }
    .underline { text-decoration: underline; }
    .align-left { text-align: left; }
    .align-center { text-align: center; }
    .align-right { text-align: right; }

    #controls {
      background: #16213e;
      padding: 8px 12px;
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      border-top: 1px solid #0f3460;
    }

    #controls button {
      background: #0f3460;
      color: #e0e0e0;
      border: none;
      padding: 6px 12px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      cursor: pointer;
      border-radius: 3px;
      transition: background 0.2s;
      flex: 1;
    }

    #controls button:hover {
      background: #1a5276;
    }

    #controls button.danger {
      background: #a93226;
    }

    #controls button.danger:hover {
      background: #c0392b;
    }

    /* Settings overlay */
    #settings-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    #settings-overlay.open {
      display: flex;
    }

    #settings-panel {
      background: #1a1a2e;
      color: #e0e0e0;
      width: 340px;
      max-width: 90%;
      border: 1px solid #0f3460;
      border-radius: 6px;
      padding: 20px 24px;
      font-family: 'Courier New', monospace;
    }

    #settings-panel h2 {
      font-size: 14px;
      margin-bottom: 16px;
      text-align: center;
      color: #e0e0e0;
    }

    #settings-panel label {
      display: block;
      font-size: 11px;
      color: #8899aa;
      margin-bottom: 3px;
      margin-top: 10px;
    }

    #settings-panel input,
    #settings-panel select {
      width: 100%;
      background: #0f3460;
      color: #e0e0e0;
      border: 1px solid #1a5276;
      padding: 7px 10px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      border-radius: 3px;
      outline: none;
    }

    #settings-panel input:focus,
    #settings-panel select:focus {
      border-color: #4caf50;
    }

    #settings-panel select {
      cursor: pointer;
    }

    .settings-actions {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .settings-actions button {
      flex: 1;
      background: #0f3460;
      color: #e0e0e0;
      border: none;
      padding: 8px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      cursor: pointer;
      border-radius: 3px;
      transition: background 0.2s;
    }

    .settings-actions button:hover {
      background: #1a5276;
    }

    .settings-actions button.primary {
      background: #2e7d32;
    }

    .settings-actions button.primary:hover {
      background: #388e3c;
    }

    #settings-status {
      font-size: 11px;
      text-align: center;
      margin-top: 10px;
      min-height: 16px;
    }

    .settings-msg-ok { color: #4caf50; }
    .settings-msg-err { color: #f44336; }

    @media print {
      body * { visibility: hidden; }
      #paper, #paper * { visibility: visible; }
      #paper { position: absolute; left: 0; top: 0; width: 80mm; }
    }
  </style>
</head>
<body>
  <div id="status-bar">
    <span style="display:flex;align-items:center;min-width:0;flex:1;">
      <span class="status-dot dot-yellow" id="status-dot"></span>
      <span id="status-text">Iniciando...</span>
    </span>
    <span style="display:flex;align-items:center;flex-shrink:0;">
      <span class="port-info" id="port-info">0.0.0.0:9100</span>
      <button class="btn-gear" id="btn-settings" title="Settings">&#9881;</button>
    </span>
  </div>

  <div id="paper-container">
    <div id="paper">
      <div id="placeholder-msg" style="text-align:center;color:#888;margin-top:40px;font-size:11px;"></div>
    </div>
  </div>

  <div id="controls">
    <button id="btn-clear">Limpiar papel</button>
    <button id="btn-test">Página prueba</button>
    <button id="btn-scroll-down" class="danger">⬇ Scroll</button>
  </div>

  <!-- Settings overlay -->
  <div id="settings-overlay">
    <div id="settings-panel">
      <h2 id="settings-title">Configuración del Servidor</h2>

      <label for="settings-ip" id="label-ip">Dirección IP</label>
      <input type="text" id="settings-ip" value="0.0.0.0" list="ip-suggestions" autocomplete="off">

      <label for="settings-port" id="label-port">Puerto</label>
      <input type="number" id="settings-port" value="9100" min="1" max="65535">

      <label for="settings-lang" id="label-lang">Idioma</label>
      <select id="settings-lang">
        <option value="es">Español</option>
        <option value="en">English</option>
      </select>

      <div id="settings-status"></div>
      <div id="config-path" style="font-size:9px;color:#556;margin-top:8px;text-align:center;word-break:break-all;"></div>

      <div class="settings-actions">
        <button id="btn-settings-cancel">Cancelar</button>
        <button id="btn-settings-apply" class="primary">Aplicar y Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
